name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lazarus
        shell: pwsh
        run: |
          choco install lazarus -y --no-progress
          "C:\lazarus" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Download SQLite DLL
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.sqlite.org/2024/sqlite-dll-win-x64-3450100.zip -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath tests

      - name: Build and run unit tests
        shell: pwsh
        run: ./scripts/run-tests.ps1

      - name: Save test evidence (XML)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./tests/hellocontacts_tests.exe) {
            ./tests/hellocontacts_tests.exe --all --format=xml --file=tests/test-results.xml
          }
          exit 0

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/test-results.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Build application
        shell: pwsh
        run: lazbuild hellocontacts.lpi

      - name: GUI tests (Search, Add, Edit, Delete)
        shell: pwsh
        run: |
          Copy-Item tests\sqlite3.dll .\sqlite3.dll
          New-Item -ItemType Directory -Force gui-evidence | Out-Null
          # Keep the full output as evidence while still showing it in the job log
          ./scripts/gui-tests.ps1 *>&1 | Tee-Object -FilePath gui-evidence\gui-tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # A screenshot of the runner's desktop shows any dialog left on screen
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save('gui-evidence\failure.png')
          }
          exit $code

      - name: Upload GUI test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-evidence
          path: gui-evidence/
          if-no-files-found: ignore
